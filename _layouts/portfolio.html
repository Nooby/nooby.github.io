<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#f8f7f4">
  <title>{% if page.title and page.title != "Home" %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  {% include _ga.html %}
  <link rel="stylesheet" href="{{ '/media/portfolio.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="site-header__brand" href="{{ '/' | relative_url }}" aria-label="Giuliano Di Pasquale CV">Giuliano Di Pasquale</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}#about">About</a>
      <a href="{{ '/' | relative_url }}#experience">Experience</a>
      <a href="{{ '/' | relative_url }}#skills">Skills</a>
      <a href="{{ '/' | relative_url }}#education">Education</a>
      <a href="{{ '/' | relative_url }}#contact">Contact</a>
    </nav>
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>Giuliano Di Pasquale · Potsdam, Germany</p>
    <a href="{{ '/' | relative_url }}#home">Back to top ↑</a>
  </footer>
</body>
</html>
